[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PUBLIC_GA4_ID = "G-QMF4FJZ0WQ"

[[redirects]]
  from = "/blog"
  to = "https://robgrappler.io/blog/?lang=en"
  status = 301
  force = true

[[redirects]]
  from = "/social"
  to = "/socials"
  status = 301

[[redirects]]
  from = "/links"
  to = "/socials"
  status = 301
